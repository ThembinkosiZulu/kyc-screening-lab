seed: 42
n_companies: 400
n_sanctions_entries: 300
n_periods: 52

ownership_threshold_pct: 25

rates:                    # share of companies receiving each flag
  sanctions_match: 0.08
  hidden_owner: 0.10
  document_mismatch: 0.08
  high_risk_location: 0.07
  look_alike: 0.08
  near_miss: 0.05

allow_multi_flag: true
multi_flag_probability: 0.05

chain_depth:              # depth = number of ownership links
  tracer_cap: 4           # the agreed depth for the success criterion
  before_evasion: [2, 4]
  after_evasion: [5, 6]
evasion_period: 27

cultures:
  chinese: 0.20
  spanish: 0.20
  german: 0.20
  arabic: 0.20
  south_african: 0.20

high_risk_countries: [Zavria, Korund, Belmara, Tessolia]
low_risk_countries: [Norvia, Elbany, Castren, Veluna, Orsova, Dunmark]

variant_level_mix:        # how planted sanctions matches are altered
  exact: 0.30
  one_change: 0.50
  two_changes: 0.20


collision_max_similarity: 90   # clean people must score below this against every sanctions name

hidden_owner_stake_range: [30, 60]   # effective stake (%) of planted hidden owners
near_miss_stake_range: [15, 22]      # just under the threshold, labelled not a red flag

high_risk_mode_mix:       # where a high-risk location is planted
  client: 0.7             # the client company itself
  holding: 0.3            # a holding company in its ownership chain
mismatch_field_mix:       # what the application and certificate disagree on
  registration_number: 0.5
  address: 0.5
